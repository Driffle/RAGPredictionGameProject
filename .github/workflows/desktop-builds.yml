name: Desktop builds

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/**"
      - "src/**"
      - "packaging/**"
      - "data/raw/**"
      - "requirements.txt"
      - ".github/workflows/desktop-builds.yml"

jobs:
  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build
        run: pyinstaller packaging/floorbrief.spec --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: FloorBrief-macOS
          path: dist/FloorBrief.app
          if-no-files-found: error
